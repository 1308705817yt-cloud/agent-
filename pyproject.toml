[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdoctor-local"
version = "0.1.0"
description = "Evidence-driven diagnosis and verified patch proposals for Python agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
agentdoctor = "agentdoctor.cli:main"

[tool.setuptools]
packages = ["agentdoctor"]

[tool.setuptools.package-data]
agentdoctor = ["demo_project/*.py", "demo_project/*.json", "demo_project/*.jsonl"]
