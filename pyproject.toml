[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdoctor-local"
version = "0.5.5"
description = "Evidence-driven diagnosis and verified patch proposals for Python agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
agentdoctor = "agentdoctor.cli:main"

[tool.setuptools]
packages = ["agentdoctor"]

[tool.setuptools.package-data]
agentdoctor = ["demo_project/*.py", "demo_project/*.json", "demo_project/*.jsonl", "benchmark_data/*.json", "benchmark_data/cases/*/*.py", "benchmark_data/cases/*/*.json", "benchmark_data/cases/*/*.txt", "workflow_data/*.json", "workflow_data/cases/*/*.py", "workflow_data/cases/*/*.json", "workflow_data/cases/*/workflow/*.py"]
